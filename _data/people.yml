# The lab is starting out, so every list is empty and the Members and Alumni
# sections do not render at all. Add entries and they appear automatically.
#
# To add a group — postdocs, visiting students — add a block to `groups`. The
# heading text lives beside its members, so there is no second list of labels
# to keep in step, and the People page head count picks it up on its own.
#
# `photo` is a path under /assets/img/people/. Leave it out and the portrait
# frame falls back to centred initials — no placeholder image needed.

