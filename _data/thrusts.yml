- id: t4
  key: micro
  nav_label: "Hardware Microarchitecture"
  title: "Hardware Microarchitecture"
  desc: "Core processor design emphasizing bandwidth-efficient memory hierarchies, execution units, and cycle-accurate simulation"
  lead: >-
    We design and evaluate core microarchitectures and memory systems to
    advance the fundamental performance of modern processors.
  p1: >-
    We investigate essential hardware structures that determine overall
    processing efficiency, focusing on bandwidth-efficient memory hierarchies,
    specialized execution units, and optimized data movement. By building
