- id: t2
  key: on-device
  nav_label: "On-Device AI Acceleration"
  title: "On-Device AI Acceleration"
  desc: "Edge-efficient execution tailored for multimodal AI deployment under strict latency, memory, and power constraints"
  lead: >-
    We develop hardware-aware execution frameworks to deploy massive multimodal
    AI models on power-constrained edge devices.
  p1: >-
    Executing complex workloads, such as Vision-Language-Action (VLA) models,
    requires tailoring advanced model compression and system-level
    optimizations to specific edge processors. We map these optimized workloads
    onto actual edge hardware to profile their real-world latency, memory
    footprint, and power consumption. This practical evaluation ensures that
    our diverse optimization strategies translate to viable on-device AI
    solutions.
  p2: ""
