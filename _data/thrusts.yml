  key: co-design
  nav_label: "Hardware-Software Co-Design"
  title: "Hardware-Software Co-Design for AI"
  desc: "Hardware-software joint optimization integrating neural network compression, sparsity, and datapath architectures"
  lead: >-
    We co-design domain-specific hardware accelerators and hardware-aware
    algorithms for efficient AI acceleration.
  p1: >-
    By jointly optimizing neural network quantization, sparsity (pruning), and
    datapath architectures, we maximize the end-to-end efficiency of AI
    workloads. Through this holistic approach, we aim to bridge the gap between
    diverse software algorithms and underlying hardware structures.
