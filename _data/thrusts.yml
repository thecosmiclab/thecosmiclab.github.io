# Research directions. `key` is what publications reference in their `thrust`
# list, so the two stay linked without a second vocabulary.
#
# Entries with `on_research: false` are filter-only: they appear as an Area
# chip on Publications but get no section on the Research page and need no
# prose. Everything else is a research direction and does.
#
# TO FILL IN: `lead`, `p1`, and optionally `p2` for each direction — `lead` is
# bolded as the opening sentence, `p1` continues it in the same paragraph.
# `ongoing:` is a list of plain strings ("what we are building right now");
# leave it empty and the "Ongoing work" panel is omitted entirely.
# `figure:` is the image for the frame and `diagram:` its alt text. With no
# figure the frame is omitted entirely.
#
# "Selected work" is NOT listed here. It comes from _data/publications.yml:
# add this area's `key` to a publication's `selected` list and it appears in
# that area's panel. Nothing to duplicate, and nothing to cap — the list is
# short because you chose what goes in it.
