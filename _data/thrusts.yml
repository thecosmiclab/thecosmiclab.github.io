  key: system
  nav_label: "System Architecture for AI"
  title: "System Architecture for AI"
  desc: "Scalable multi-node systems featuring Processing-Near-Memory (PNM), CXL, and multi-GPU orchestration"
  lead: >-
    We design hardware architectures and optimize system stacks to accelerate
    large-scale AI across multiple compute nodes.
  p1: >-
    To overcome the interconnect and memory bottlenecks of datacenter AI, we
    develop scalable systems ranging from Processing-Near-Memory (PNM) hardware
    to efficient multi-GPU configurations. By leveraging technologies such as
