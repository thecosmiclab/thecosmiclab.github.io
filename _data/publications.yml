# The PI's publications and patents, newest first. Papers and patents are
# interleaved strictly by date rather than grouped by kind. Entries sharing a
# venue and year — two papers at the same conference — are ordered
# alphabetically by title, since there is no date between them.
#
# THE FILE ORDER IS THE PAGE ORDER. A new entry goes at the top; nothing sorts
# it for you.
#
# Sources: the PI's own publications page and CV (which entries, links, awards,
# and the * marking co-first authorship), DBLP for full author lists, Google
# Patents for inventors and grant dates.
#
# `thrust` entries must match a `key` in _data/thrusts.yml — that one
# vocabulary drives the Area filter. An empty list means the entry shows under
# "All" but under no single area.
#
# `selected` is the ONE area this entry is featured under on the Research
# page's "Selected work" list. Two rules:
#   - it must be one of this entry's own `thrust` values, or the paper is
#     featured in an area its own filter does not place it in;
#   - at most one area, so no paper appears twice across the four panels.
# An empty list is the right default for most entries — the point of the list
# is that it is short.
#
# `type` is one of: conference, journal, chapter, patent, workshop, preprint.
# It is what the Type filter is built from, so a new value creates a new chip.
#
# Mark the PI with `me: true` and the name is bolded.
#
# `bibtex` is the record the Export BibTeX link hands out verbatim. Papers use
# DBLP's official entry (DBLP bookkeeping fields removed, citation key
# rewritten to firstauthor+year+shortname); the PACT 2026 paper and the three
# patents are not in DBLP, so those entries are written by hand.
# Without this field the exporter falls back to a bare generated stub, so keep
# it filled in for new entries.

