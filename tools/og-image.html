<!doctype html>
<!--
  Source for assets/img/og-image.png, the picture shown when a link to the site
  is pasted into KakaoTalk, Slack, X and the like. Not part of the site build.

  Regenerate after changing it:   ./tools/og-image.sh

  Left-aligned, like the hero on the site's homepage, so the card and the page
  it opens read as the same thing.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{
    font-family:"Pretendard Variable","Pretendard",-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    background:linear-gradient(168deg,color-mix(in srgb,#0F2C59 95%,#FFFFFF) 0%,#0F2C59 58%);
    display:flex;flex-direction:column;align-items:flex-start;justify-content:center;text-align:left;
    padding:0 96px;box-sizing:border-box;
    color:rgb(247,247,247);
  }
  .eyebrow{font-size:30px;line-height:40px;font-weight:600;letter-spacing:0.02em;color:rgba(194,196,200,0.88);margin-bottom:22px}
  .wm{display:flex;align-items:center;gap:22px;font-size:112px;line-height:1;letter-spacing:-0.03em}
    .cosmic{font-weight:700}
  .lab{font-weight:500;color:rgba(194,196,200,0.88);margin-left:4px}
  .tagline{margin-top:34px;font-size:34px;line-height:46px;font-weight:500;letter-spacing:-0.005em;color:rgba(194,196,200,0.88)}
  .url{position:absolute;bottom:48px;left:96px;font-size:22px;line-height:30px;font-weight:500;color:rgba(158,197,255,0.9)}
</style>
</head>
<body>
  <div class="eyebrow">GIST</div>
  <div class="wm"><span class="cosmic">COSMIC</span><span class="lab">Lab</span></div>
  <div class="tagline">Computer System and Microarchitecture Design Laboratory</div>
  <div class="url">thecosmiclab.github.io</div>
</body>
</html>
