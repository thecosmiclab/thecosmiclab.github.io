<link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
{%- comment -%}
  GitHub Pages tells browsers to reuse CSS and JS for ten minutes. The build
  time on the URL changes with every deploy, so visitors get the new files
  straight away instead of a stale stylesheet against fresh HTML.
{%- endcomment -%}
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">
